name: Flutter CI

on:
  push:
    branches: [main]
    paths:
      - 'wishtick_flutter/**'
      - '.github/workflows/flutter-ci.yml'
  pull_request:
    paths:
      - 'wishtick_flutter/**'
      - '.github/workflows/flutter-ci.yml'

defaults:
  run:
    working-directory: wishtick_flutter

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: wishtick_flutter/pubspec.yaml
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Verify formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos

      # Includes the design-system guard: fails if a colour literal escapes
      # AppPalette or a widget imports the palette directly.
      - name: Test
        run: flutter test

  build-android:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: wishtick_flutter/pubspec.yaml
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build apk --debug
