name: wishtick_flutter
description: "Wishtick — gifting, made together."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.0.0

  # Navigation
  go_router: ^17.3.0

  # Networking
  dio: ^5.11.0
  # Group-gift chat is delivered over the backend's Socket.IO `/chat`
  # namespace. Messages are still *posted* over REST — the socket only
  # delivers — so this is a read path, not a second way to mutate.
  socket_io_client: ^3.1.2

  # Storage
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.5.5

  # UI
  cached_network_image: ^3.4.1
  intl: ^0.20.3
  confetti: ^0.8.0
  image_picker: ^1.2.3
  # "Upload Your Own Invitation" (`2248:70`) accepts GIF, MP4 and PDF as well
  # as stills — image_picker cannot open any of the three.
  file_picker: ^10.3.10
  # Pinned below 13 on purpose: 13.x wants win32 ^6, file_picker wants win32 ^5,
  # and pub cannot satisfy both. 12.x has the same `SharePlus.instance` API we
  # use, so the cost of the downgrade is nil.
  share_plus: ^12.0.2
  url_launcher: ^6.3.2

  # Push notifications. The backend already speaks FCM HTTP v1 and keeps a
  # device-token registry (`POST /me/devices`); these are what give it a token
  # to register. `firebase_core` is not optional — every FlutterFire plugin
  # needs it to find the project config.
  #
  # Only messaging: no analytics, no crashlytics. Each Firebase product pulls
  # its own native SDK into the APK, and nothing here asks for those.
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10

  # Draws the notification when one arrives while the app is open, which is the
  # one case FCM does not cover: Android hands a foreground message to the app
  # instead of the tray, so without this a push that lands mid-session is
  # silent and invisible. Also owns the notification channel that the manifest's
  # `default_notification_channel_id` names, so background and foreground
  # notifications share one set of user-visible settings.
  flutter_local_notifications: ^19.4.2

  # The chat composer's emoji keyboard. Chosen over hand-rolling one: a picker
  # is a categorised, searchable, skin-tone-aware set of ~1800 codepoints with
  # a recents list, and the hard part is knowing which of them the running
  # platform can actually render — this package checks, and drops the ones that
  # would show as tofu.
  emoji_picker_flutter: ^3.1.0

  # Memory wishes (Sprint 8). A voice note needs position/duration streams and
  # a seek, which is what the story's transport row is made of; a video wish
  # needs a first frame to sit under the play button before it plays.
  just_audio: ^0.10.5
  video_player: ^2.10.1
  google_fonts: ^8.2.1
  crop_your_image: ^2.0.0
  font_awesome_flutter: ^11.0.0
  flutter_contacts: ^2.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Both arrive transitively with url_launcher; declared here so the buy-link
  # tests can install a recording UrlLauncherPlatform. Without that, the only
  # way an affiliate redirect breaks — opening the merchant directly, or not
  # opening at all — is invisible to every other kind of test.
  plugin_platform_interface: ^2.1.8
  url_launcher_platform_interface: ^2.3.2

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/Celebrations_images/
    - assets/images/Home_page_banners/
    - assets/images/Memory/
    - assets/images/Wishlist/
    - assets/images/template_bg/
    - assets/onboarding_carousel/1.webp
    - assets/onboarding_carousel/2.webp
    - assets/onboarding_carousel/3.webp
    - assets/onboarding_carousel/4.webp
    - assets/avatar/
    - assets/onboarding/
    - assets/logo/
    - assets/icons/

  # Bundled rather than fetched at runtime: no flash of fallback type on first
  # launch, works offline, and keeps golden tests deterministic. Both are
  # variable fonts (single file, full weight axis) — see AppTypography, which
  # drives the `wght` axis via FontVariation.
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat.ttf
    - family: CormorantGaramond
      fonts:
        - asset: assets/fonts/CormorantGaramond.ttf
