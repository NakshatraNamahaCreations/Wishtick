name: wishtick_flutter
description: "Wishtick — gifting, made together."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.0.0

  # Navigation
  go_router: ^17.3.0

  # Networking
  dio: ^5.11.0

  # Storage
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.5.5

  # UI
  cached_network_image: ^3.4.1
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  # Bundled rather than fetched at runtime: no flash of fallback type on first
  # launch, works offline, and keeps golden tests deterministic. Both are
  # variable fonts (single file, full weight axis) — see AppTypography, which
  # drives the `wght` axis via FontVariation.
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat.ttf
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay.ttf
