org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# The Kotlin incremental compiler double-registers its cache storage on this
# toolchain and fails every plugin module with "Could not close incremental
# caches ... is already registered". Disabling incremental compilation is the
# documented workaround; it costs plugin rebuild time only. Revisit when the
# Kotlin/AGP versions move.
kotlin.incremental=false
